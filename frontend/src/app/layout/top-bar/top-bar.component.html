<header
  class="top-bar sticky top-0 z-(--layout-topbar-z-index) flex min-h-(--topbar-height) shrink-0 items-center gap-3 border-b border-p-surface-border bg-p-surface-section px-5"
  role="banner"
>
  <div class="min-w-0 flex-1">
    <h1 class="truncate text-base font-semibold leading-tight text-p-text-primary">
      {{ titleParts().beforeCode }}
      @if (titleParts().code; as deliveryCode) {
        <span class="top-title-delivery-code">{{ deliveryCode }}</span>
      }
    </h1>
    @if (subtitle(); as subtitleText) {
      <p class="mt-1 truncate text-xs leading-snug text-p-text-muted">{{ subtitleText }}</p>
    }
  </div>

  <ng-content select="[topbar-actions]"></ng-content>

  <div class="flex items-center gap-2">
    @if (action(); as topAction) {
      <button
        type="button"
        class="top-action-btn"
        (click)="runHeaderAction()"
      >
        @if (topAction.icon) {
          <i [class]="topAction.icon + ' top-action-btn-icon'" aria-hidden="true"></i>
        }
        <span>{{ topAction.label }}</span>
      </button>
    }

    <button
      type="button"
      class="top-logout-btn"
      aria-label="Log out"
      (click)="logout()"
    >
      <i class="pi pi-sign-out top-logout-btn-icon" aria-hidden="true"></i>
      <span>Log out</span>
    </button>
  </div>
</header>
