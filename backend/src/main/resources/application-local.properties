spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/deliveryhub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:deliveryhub}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:deliveryhub}

# RabbitMQ (must match docker/docker-compose.yml service "rabbitmq")
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:deliveryhub}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:deliveryhub}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:/}

# Keep local notification flow persisted for #48 UI consumption.
notifications.async.enabled=${NOTIFICATIONS_ASYNC_ENABLED:false}
notifications.async.fallback-to-sync=${NOTIFICATIONS_ASYNC_FALLBACK_TO_SYNC:true}
notifications.async.consumer-enabled=${NOTIFICATIONS_ASYNC_CONSUMER_ENABLED:false}
notifications.async.max-retries=${NOTIFICATIONS_ASYNC_MAX_RETRIES:5}

# async assignment defaults stay off in local unless explicitly enabled
delivery.assignment.async.enabled=${DELIVERY_ASSIGNMENT_ASYNC_ENABLED:false}
delivery.assignment.async.consumer-enabled=${DELIVERY_ASSIGNMENT_ASYNC_CONSUMER_ENABLED:false}
delivery.assignment.async.max-retries=${DELIVERY_ASSIGNMENT_ASYNC_MAX_RETRIES:5}

